<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUXIFERW</title>

    <!-- Aesthetic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #302040 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #202d40 0%,
                    transparent 30%
                ),
                #09090d;

            color: #eee;
            font-family: "Montserrat", sans-serif;
            overflow-x: hidden;
        }

        /* Background Glow */
        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            background: #a78bfa;
            filter: blur(180px);
            opacity: 0.08;

            border-radius: 50%;

            top: -180px;
            left: -180px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 400px;
            height: 400px;

            background: #6d5dfc;
            filter: blur(180px);
            opacity: 0.05;

            border-radius: 50%;

            right: -180px;
            bottom: -180px;

            pointer-events: none;
        }

        /* Main Container */
        .container {
            width: 92%;
            max-width: 850px;
            padding: 25px;

            position: relative;
            z-index: 2;
        }

        /* Main Card */
        .card {
            position: relative;

            padding: 35px 25px;
            text-align: center;

            background: rgba(18, 18, 26, 0.72);

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.45),
                inset 0 0 30px rgba(255, 255, 255, 0.02);

            overflow: hidden;
        }

        /* Subtle Card Glow */
        .card::before {
            content: "";

            position: absolute;
            width: 250px;
            height: 250px;

            top: -150px;
            left: 50%;
            transform: translateX(-50%);

            background: #a78bfa;
            filter: blur(120px);
            opacity: 0.08;

            pointer-events: none;
        }

        /* GIF */
        .gif {
            width: 100%;
            max-height: 220px;

            object-fit: cover;

            border-radius: 20px;
            margin-bottom: 25px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            opacity: 0.9;
        }

        /* Profile Picture */
        .profile {
            width: 125px;
            height: 125px;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid rgba(255, 255, 255, 0.35);

            box-shadow:
                0 0 30px rgba(167, 139, 250, 0.25),
                0 0 70px rgba(167, 139, 250, 0.08);

            margin-bottom: 18px;

            transition: 0.4s ease;
        }

        .profile:hover {
            transform: scale(1.04);

            box-shadow:
                0 0 40px rgba(167, 139, 250, 0.35),
                0 0 80px rgba(167, 139, 250, 0.12);
        }

        /* Name */
        .name {
            font-family: "Cinzel", serif;

            font-size: 34px;
            font-weight: 700;

            letter-spacing: 5px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #c4b5fd,
                #ffffff
            );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 8px;
        }

        /* Subtitle */
        .subtitle {
            font-size: 12px;

            letter-spacing: 4px;
            text-transform: uppercase;

            color: #aaa;

            margin-bottom: 25px;
        }

        /* Divider */
        .line {
            width: 80%;
            height: 1px;

            margin: 0 auto 25px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(196, 181, 253, 0.7),
                transparent
            );
        }

        /* About */
        .about {
            font-family: "Cinzel", serif;

            font-size: 14px;
            line-height: 2;

            letter-spacing: 1.5px;

            color: #cfcfcf;

            text-align: center;

            max-width: 600px;

            margin: auto;
        }

        /* About Title */
        .about-title {
            font-family: "Cinzel", serif;

            font-size: 19px;
            font-weight: 700;

            letter-spacing: 5px;

            color: #d8b4fe;

            text-shadow:
                0 0 15px rgba(216, 180, 254, 0.35);
        }

        .about span {
            color: #d8b4fe;
        }

        /* Social Links */
        .links {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 13px;

            margin-top: 30px;
        }

        /* Link Card */
        .link {
            text-decoration: none;
            color: #eee;

            padding: 15px 10px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.025);

            transition: 0.3s ease;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 82px;
        }

        .link:hover {
            transform: translateY(-5px);

            background: rgba(196, 181, 253, 0.08);

            border-color: rgba(196, 181, 253, 0.4);

            box-shadow:
                0 10px 30px rgba(167, 139, 250, 0.12);
        }

        /* Real Social Icons */
        .social-icon {
            width: 27px;
            height: 27px;

            display: block;

            margin-bottom: 8px;

            object-fit: contain;

            transition: 0.3s ease;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(216, 180, 254, 0.15)
                );
        }

        .link:hover .social-icon {
            transform: scale(1.15);

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(216, 180, 254, 0.35)
                );
        }

        /* Labels */
        .label {
            font-size: 11px;

            letter-spacing: 2px;

            color: #999;

            text-transform: uppercase;

            transition: 0.3s ease;
        }

        .link:hover .label {
            color: #ddd;
        }

        /* Footer */
        .footer {
            margin-top: 30px;

            font-size: 10px;

            letter-spacing: 3px;

            color: #666;
        }

        /* Background Music */
        .background-music {
            display: none;
        }

        /* Music Button */
        .music-button {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            border: 1px solid rgba(216, 180, 254, 0.3);

            background: rgba(18, 18, 26, 0.8);

            color: #d8b4fe;

            font-size: 18px;

            cursor: pointer;

            z-index: 10;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.3);

            transition: 0.3s ease;
        }

        .music-button:hover {
            transform: scale(1.08);

            border-color: rgba(216, 180, 254, 0.6);

            box-shadow:
                0 0 25px rgba(167, 139, 250, 0.25);
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                width: 96%;
                padding: 12px;
            }

            .card {
                padding: 25px 16px;
            }

            .profile {
                width: 110px;
                height: 110px;
            }

            .name {
                font-size: 25px;
                letter-spacing: 3px;
            }

            .links {
                grid-template-columns: 1fr;
            }

            .gif {
                max-height: 170px;
            }

            .about {
                font-size: 13px;
                line-height: 1.9;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND MUSIC -->
    <audio
        id="backgroundAudio"
        class="background-music"
        loop
        preload="auto"
    >

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

        Your browser does not support audio.

    </audio>


    <main class="container">

        <section class="card">





            <img
                src="profile.png"
                class="profile"
                alt="Profile Picture"
            >


            <!-- NAME -->
            <h1 class="name">
                CRUXIFERW
            </h1>


            <p class="subtitle">
            </p>


            <div class="line"></div>



            <p class="about">

                <span class="about-title">
                    ABOUT ME
                </span>

                <br><br>

                WEB DEVELOPER AND PYTHON CODER

                <br><br>

                EXTRAS - PAID INSTA ACCOUNT REMOVALS AND INTERNATION WP SELLER

            </p>


            <!-- LINKS -->
            <div class="links">


                <!-- INSTAGRAM -->
                <a
                    href="https://instagram.com/cruxiferw"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                >

                    <img
                        class="social-icon"
                        src="https://cdn.simpleicons.org/instagram"
                        alt="Instagram"
                    >

                    <span class="label">
                        Instagram
                    </span>

                </a>


                <!-- WHATSAPP -->
                <a
                    href="https://wa.me/9236479254"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                >

                    <img
                        class="social-icon"
                        src="https://cdn.simpleicons.org/whatsapp"
                        alt="WhatsApp"
                    >

                    <span class="label">
                        WhatsApp
                    </span>

                </a>


                <!-- EMAIL -->
                <a
                    href="mailto:cruxiferw@hi2.in"
                    class="link"
                >

                    <img
                        class="social-icon"
                        src="https://cdn.simpleicons.org/gmail"
                        alt="Email"
                    >

                    <span class="label">
                        Email
                    </span>

                </a>


            </div>


            <!-- FOOTER -->
            <div class="footer">
                @cruxiferw
            </div>


        </section>

    </main>


    <!-- MUSIC CONTROL -->
    <button
        id="musicButton"
        class="music-button"
        aria-label="Toggle music"
        title="Play / Pause Music"
    >
        ♫
    </button>


    <script>

        const audio = document.getElementById("backgroundAudio");
        const musicButton = document.getElementById("musicButton");

        /* Music volume */
        audio.volume = 0.35;


        /* Try to start music automatically */
        window.addEventListener("load", function () {

            audio.play().catch(function () {
                console.log("Autoplay blocked. Click anywhere to start music.");
            });

        });


        /* Start music after first user interaction */
        function startMusic() {

            if (audio.paused) {

                audio.play().catch(function () {});

            }

        }


        document.addEventListener(
            "click",
            startMusic,
            { once: true }
        );


        document.addEventListener(
            "touchstart",
            startMusic,
            { once: true }
        );


        document.addEventListener(
            "keydown",
            startMusic,
            { once: true }
        );


        /* Music button */
        musicButton.addEventListener("click", function (event) {

            event.stopPropagation();

            if (audio.paused) {

                audio.play();

                musicButton.innerHTML = "♫";

            } else {

                audio.pause();

                musicButton.innerHTML = "Ⅱ";

            }

        });


        /* Keep music looping */
        audio.addEventListener("ended", function () {

            audio.currentTime = 0;

            audio.play();

        });

    </script>


</body>

</html>
